# 지원모아 CI — 수집기 규칙 회귀 테스트와 화면 스크립트 문법 검사.
# 표준 라이브러리만 쓰므로 설치 단계가 없다(서버 cron과 같은 Python 3.12).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rules
        run: python -m unittest discover -s tests -v
      - name: Site script syntax
        run: node --check site/app.js && node --check site/sound.js
