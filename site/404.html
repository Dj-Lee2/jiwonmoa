<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>찾는 페이지가 없어요 | 지원모아</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- 없는 주소(404) 화면. Caddy handle_errors 404가 이 파일을 보인다(deploy/setup_hosting.sh). 스크립트 없음(CSP) -->
<style>
  html, body { margin: 0; }
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #fff; color: #333;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; text-align: center; }
  img { width: 112px; height: 112px; }
  h1 { margin: 16px 0 8px; font-size: 1.75rem; line-height: 1.3; letter-spacing: -0.02em; color: #111; }
  p { margin: 0 0 24px; line-height: 1.6; color: #666; text-wrap: pretty; word-break: keep-all; }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 16px; font-weight: 700; text-decoration: none;
    color: #111; background: #eee; }
  a.go { background: #fae100; color: #000; box-shadow: inset 0 0 0 2px #000; }
  a:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  @media (max-width: 420px) { nav { flex-direction: column; } a { justify-content: center; } }
  @media (hover: hover) { a:not(.go):hover { background: #dcdcdc; } }
</style>
</head>
<body>
<main>
  <img src="/img/mascot-still.webp" alt="" width="112" height="112">
  <h1>찾는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력되었을 수 있어요. 지원사업은 홈과 목록에서 찾아보세요.</p>
  <nav aria-label="갈 곳">
    <a class="go" href="/">지원모아 홈으로</a>
    <a href="/#tab=open">모집 공고 보기</a>
    <a href="/#tab=services">공공서비스 보기</a>
  </nav>
</main>
</body>
</html>
